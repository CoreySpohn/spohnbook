[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spohnbook"
dynamic = ["version"]
description = "The map, shared conventions and assembled examples of a suite of JAX libraries for exoplanet direct imaging"
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = []

[project.urls]
Repository = "https://github.com/CoreySpohn/spohnbook"
Documentation = "https://spohnbook.readthedocs.io"

[project.optional-dependencies]
dev = ["pre-commit"]
test = [
    "pytest",
    "pyyaml",
    "ineedvalidation",
    "jax",
    "numpy",
    "hwoutils",
    "optixstuff",
]
docs = [
    "myst-nb",
    "sphinx-book-theme",
    "pyyaml",
    "hwoutils",
    "hwostyle",
    "eyepiece>=0.4.0",
    "orbix",
    "skyscapes",
    "optixstuff",
    "yippy",
    "physicaloptix",
    "tiptilt",
    "coronagraphoto",
    "coronalyze",
    "jaxedith",
    "photomancy",
]
# Renders the Manim explainer clips (tools/explainers/_manim.py); needs system
# Cairo, Pango, pkg-config and ffmpeg, and no TeX. The pins match eyepiece's
# manim extra (Pillow 13 drops an argument manim 0.21 uses); depend on
# "eyepiece[manim]" instead once a release ships that extra.
explainers-manim = ["manim>=0.21,<0.22", "pillow<13"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/**" = ["D"]
"tools/build_*.py" = ["D", "E501"]
"tools/explainers/d[0-9][0-9]_*.py" = ["D", "E501"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/spohnbook/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spohnbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "manim: renders a Manim clip (needs the explainers-manim extra and system Cairo, Pango and ffmpeg)",
]

[tool.ineedvalidation]
library = "spohnbook"
