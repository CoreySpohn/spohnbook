name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Tests and documentation build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create venv
      run: uv venv .venv --python 3.12

    - name: Install package with test and docs dependencies
      run: uv pip install -e ".[test,docs]"
      env:
        VIRTUAL_ENV: ${{ github.workspace }}/.venv

    - name: Run tests
      run: .venv/bin/pytest tests/ -v --tb=short

    - name: Build the documentation, executing the examples
      run: .venv/bin/python -m sphinx -W --keep-going -b html docs docs/_build/html
