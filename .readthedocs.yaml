# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # Record the evidence the rendered case states are computed from. A failing
    # test is recorded in the ledger and shown on the evidence page, so it does
    # not stop the site from building.
    pre_build:
      - mkdir -p docs/_evidence
      - python -m pytest tests --vv-evidence docs/_evidence/ledger.json || echo "tests failed; the ledger records it"
      - python tools/record_build.py --resolution locked --ledger docs/_evidence/ledger.json --fetch-inputs --output docs/_evidence/build-manifest.json --command "readthedocs pre_build" || echo "the manifest is incomplete"

python:
  install:
    # Every edition builds with the dependency lock recorded at its tag.
    - requirements: requirements-docs.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py
