370.000000" y="12.000000" width="403.000000" height="104.000000" rx="10.000000" stroke="#0097A7" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="571.500000" y="52.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="571.500000" dy="0.000000">S0  Define the contracts</tspan><tspan x="571.500000" dy="19.666667">Handbook + decisions + independent fixtures</tspan><tspan x="571.500000" dy="19.666667">Documentation is part of acceptance</tspan></text></g><g class="Ym91bmRhcmllcw== stage"><g class="shape" ><rect x="348.000000" y="186.000000" width="446.000000" height="104.000000" rx="10.000000" stroke="#0097A7" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="571.000000" y="226.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="571.000000" dy="0.000000">S1  Repair and certify boundaries</tspan><tspan x="571.000000" dy="19.666667">Geometry / import / radiometry / detector</tspan><tspan x="571.000000" dy="19.666667">Named source and consumer agree with an anchor</tspan></text></g><g class="Zml4ZWQ= stage"><g class="shape" ><rect x="358.000000" y="360.000000" width="426.000000" height="104.000000" rx="10.000000" stroke="#0097A7" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="571.000000" y="400.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="571.000000" dy="0.000000">S2  One fixed physical campaign</tspan><tspan x="571.000000" dy="19.666667">Known companion, few visits, explicit reporting</tspan><tspan x="571.000000" dy="19.666667">Refit, persist, resume, account once</tspan></text></g><g class="YWRhcHRpdmU= model"><g class="shape" ><rect x="12.000000" y="544.000000" width="351.000000" height="104.000000" rx="10.000000" stroke="#C2185B" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="187.500000" y="584.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="187.500000" dy="0.000000">S3  Adaptive choice</tspan><tspan x="187.500000" dy="19.666667">Response support + cache identity</tspan><tspan x="187.500000" dy="19.666667">Information agrees with reported data</tspan></text></g><g class="aW1hZ2Vz model"><g class="shape" ><rect x="383.000000" y="544.000000" width="377.000000" height="104.000000" rx="10.000000" stroke="#C2185B" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="571.500000" y="584.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="571.500000" dy="0.000000">S4  Images and IFS</tspan><tspan x="571.500000" dy="19.666667">Centers + coherent light + response losses</tspan><tspan x="571.500000" dy="19.666667">Correlated measurement calibration</tspan></text></g><g class="ZW5zZW1ibGU= model"><g class="shape" ><rect x="780.000000" y="544.000000" width="412.000000" height="104.000000" rx="10.000000" stroke="#C2185B" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="986.000000" y="584.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="986.000000" dy="0.000000">S5  Ensembles and external references</tspan><tspan x="986.000000" dy="19.666667">Estimator uncertainty + matched experiments</tspan><tspan x="986.000000" dy="19.666667">Broader workflows carry their own gates</tspan></text></g><g class="KGZvdW5kYXRpb24gLSZndDsgYm91bmRhcmllcylbMF0="><marker id="mk-d2-570316520-2524945847" markerWidth="10.000000" markerHeight="12.000000" refX="7.000000" refY="6.000000" viewBox="0.000000 0.000000 10.000000 12.000000" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0.000000,0.000000 10.000000,6.000000 0.000000,12.000000" fill="#74818C" class="connection" stroke-width="2" /> </marker><path d="M 571.500000 118.000000 L 571.500000 182.000000" stroke="#74818C" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-570316520-2524945847)" mask="url(#d2-570316520)" /></g><g class="KGJvdW5kYXJpZXMgLSZndDsgZml4ZWQpWzBd"><path d="M 571.500000 292.00