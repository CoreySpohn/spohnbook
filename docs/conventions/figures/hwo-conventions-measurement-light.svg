="shape" ><rect x="90.000000" y="12.000000" width="469.000000" height="86.000000" rx="10.000000" stroke="#0097A7" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="324.500000" y="52.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="324.500000" dy="0.000000">Parameter theta + resolved experiment</tspan><tspan x="324.500000" dy="20.500000">Response, exposure, noise and selection are specified</tspan></text></g><g class="bGF0ZW50 stage"><g class="shape" ><rect x="152.000000" y="168.000000" width="346.000000" height="86.000000" rx="10.000000" stroke="#0097A7" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="325.000000" y="208.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="325.000000" dy="0.000000">Joint measurement and reporting law</tspan><tspan x="325.000000" dy="20.500000">Generate Y and the reporting event D</tspan></text></g><g class="JiMzOTtudWxsJiMzOTs= stage"><g class="shape" ><rect x="12.000000" y="334.000000" width="283.000000" height="104.000000" rx="10.000000" stroke="#0097A7" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="153.500000" y="374.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="153.500000" dy="0.000000">D = 0: successful nondetection</tspan><tspan x="153.500000" dy="19.666667">Record the flag and response</tspan><tspan x="153.500000" dy="19.666667">Likelihood: P(D = 0 | theta)</tspan></text></g><g class="ZGV0ZWN0ZWQ= stage"><g class="shape" ><rect x="315.000000" y="334.000000" width="364.000000" height="104.000000" rx="10.000000" stroke="#0097A7" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="497.000000" y="374.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="497.000000" dy="0.000000">D = 1: retained measurement y</tspan><tspan x="497.000000" dy="19.666667">Record values and covariance semantics</tspan><tspan x="497.000000" dy="19.666667">Likelihood: p(y, D = 1 | theta)</tspan></text></g><g class="aW5mZXJlbmNl model"><g class="shape" ><rect x="69.000000" y="518.000000" width="511.000000" height="104.000000" rx="10.000000" stroke="#C2185B" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="324.500000" y="558.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="324.500000" dy="0.000000">Use exactly the acquired record</tspan><tspan x="324.500000" dy="19.666667">Do not add unreported astrometry or count selection twice</tspan><tspan x="324.500000" dy="19.666667">Forced photometry requires a different record contract</tspan></text></g><g class="YW5jaG9y model"><g class="shape" ><rect x="77.000000" y="692.000000" width="495.000000" height="104.000000" rx="10.000000" stroke="#C2185B" fill="#F2F6F8" style="stroke-width:2;" /></g><text x="324.500000" y="732.500000" fill="#20252B" class="text-bold" style="text-anchor:middle;font-size:18px"><tspan x="324.500000" dy="0.000000">Information anchor</tspan><tspan x="324.500000" dy="19.666667">If every theta always produces the same retained record,</tspan><tspan x="324.500000" dy="19.666667">I(theta; record) = 0</tspan></text></g><g class="KGV4cGVyaW1lbnQgLSZndDsgbGF0ZW50KVswXQ=="><marker id="mk-d2-1439295388-2524945847" markerWidth="10.000000" markerHeight="12.000000" refX="7.000000" refY="6.000000" viewBox="0.000000 0.000000 10.000000 12.000000" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0.000000,0.000000 10.000000,6.000000 0.000000,12.000000" fill="#74818C" class="connection" stroke-width="2" /> </marker><path d="M 325.250000 100.000000 L 325.250000 164.000000" stroke="#74818C" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-d2-1439295388-2524945847)" mask="url(#d2-1439295388)" /></g><g class="KGxhdGVudCAtJmd0OyAmIzM5O251bGwmIzM5OylbMF0="><path d="M 267.583008 256.000000 L 267.583008 330.000000" stroke="#74818C" fill="none" class="connection" style="stroke-width:2;" marker-end="url(#mk-